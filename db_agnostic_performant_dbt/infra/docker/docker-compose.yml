# Local integration targets. Snowflake and Databricks are cloud-only.
# Passwords below are for local development only.
name: dbt-agnostic

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt_local_pw
      POSTGRES_DB: analytics
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=32MB", "-c", "max_wal_size=2GB"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d analytics"]
      interval: 5s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dbt_local_pw1"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'select 1' || exit 1"]
      interval: 10s
      retries: 30

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: dbt_local_pw
      APP_USER: dbt
      APP_USER_PASSWORD: dbt_local_pw
    ports: ["1521:1521"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 60
