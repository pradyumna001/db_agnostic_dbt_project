framework: terraform
download-external-modules: false
# Accepted risks (reviewed):
skip-check:
  - CKV_TF_1      # registry modules are pinned by version constraint, not commit hash
  - CKV_AWS_382   # MWAA workers need outbound internet (PyPI, Snowflake, Databricks)
  - CKV_AWS_157   # Multi-AZ is a variable: off in dev, on in prod
  - CKV_AWS_293   # deletion protection is a variable: off in dev, on in prod
  - CKV_AWS_144   # cross-region replication is a DR decision, not enabled by default
  - CKV_AWS_18    # S3 access logging requires a dedicated log bucket; enable per org standard
  - CKV2_AWS_62   # no consumers for S3 event notifications
  - CKV2_AWS_57   # PII salt must stay stable (rotation changes all tokens); warehouse keys rotate out-of-band
