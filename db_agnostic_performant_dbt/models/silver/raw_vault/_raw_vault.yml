version: 2

models:
  - name: hub_customer
    description: Customers by business key (customer_id). Fed by customers and orders.
    columns:
      - name: customer_hk
        data_tests: [unique, not_null]
  - name: hub_product
    columns:
      - name: product_hk
        data_tests: [unique, not_null]
  - name: hub_order
    columns:
      - name: order_hk
        data_tests: [unique, not_null]
  - name: hub_payment
    columns:
      - name: payment_hk
        data_tests: [unique, not_null]

  - name: lnk_order_customer
    columns:
      - name: order_customer_hk
        data_tests: [unique, not_null]
      - name: order_hk
        data_tests:
          - relationships: {arguments: {to: ref('hub_order'), field: order_hk}}
      - name: customer_hk
        data_tests:
          - relationships: {arguments: {to: ref('hub_customer'), field: customer_hk}}
  - name: lnk_order_product
    columns:
      - name: order_line_hk
        data_tests: [unique, not_null]
      - name: product_hk
        data_tests:
          - relationships: {arguments: {to: ref('hub_product'), field: product_hk}}
  - name: lnk_order_payment
    columns:
      - name: order_payment_hk
        data_tests: [unique, not_null]

  - name: sat_customer_details
    data_tests:
      - unique_combination: {arguments: {columns: [customer_hk, load_dts]}}
  - name: sat_customer_pii
    description: Customer PII. Restricted; masked natively on Snowflake, Databricks and SQL Server.
    data_tests:
      - unique_combination: {arguments: {columns: [customer_hk, load_dts]}}
    columns:
      - name: first_name
        meta: {pii: true, pii_class: name}
      - name: last_name
        meta: {pii: true, pii_class: name}
      - name: email
        meta: {pii: true, pii_class: email}
      - name: phone
        meta: {pii: true, pii_class: phone}
      - name: date_of_birth
        meta: {pii: true, pii_class: date}
      - name: address_line1
        meta: {pii: true, pii_class: address}
      - name: postal_code
        meta: {pii: true, pii_class: postal_code}
  - name: sat_product_details
    data_tests:
      - unique_combination: {arguments: {columns: [product_hk, load_dts]}}
  - name: sat_order_details
    data_tests:
      - unique_combination: {arguments: {columns: [order_hk, load_dts]}}
  - name: sat_order_line_details
    data_tests:
      - unique_combination: {arguments: {columns: [order_line_hk, load_dts]}}
  - name: sat_payment_details
    data_tests:
      - unique_combination: {arguments: {columns: [payment_hk, load_dts]}}
    columns:
      - name: card_last4
        meta: {pii: true, pii_class: card}
  - name: efs_order_customer
    description: Effectivity of the order -> customer relationship (driving key order_hk).
    data_tests:
      - unique_combination: {arguments: {columns: [order_customer_hk, load_dts, is_active]}}
