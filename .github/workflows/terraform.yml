name: terraform

on:
  pull_request:
    paths: ["db_agnostic_performant_dbt/infra/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["db_agnostic_performant_dbt/infra/terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: db_agnostic_performant_dbt/infra/terraform

jobs:
  static:
    name: fmt / validate / tflint / checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - name: validate
        run: |
          for env in envs/*/; do
            terraform -chdir="$env" init -backend=false -input=false
            terraform -chdir="$env" validate
          done
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init --config "$PWD/.tflint.hcl" && tflint --recursive --config "$PWD/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: db_agnostic_performant_dbt/infra/terraform
          framework: terraform
          config_file: db_agnostic_performant_dbt/infra/terraform/.checkov.yml

  plan:
    name: plan (${{ matrix.env }})
    needs: static
    if: vars.ENABLE_TERRAFORM_PLAN == 'true'
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}-plan
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        env: [dev, prod]
    env:
      SNOWFLAKE_ORGANIZATION_NAME: ${{ vars.SNOWFLAKE_ORGANIZATION_NAME }}
      SNOWFLAKE_ACCOUNT_NAME: ${{ vars.SNOWFLAKE_ACCOUNT_NAME }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_TF_USER }}
      SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_TF_PRIVATE_KEY }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_TF_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_TF_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: init
        run: >-
          terraform -chdir=envs/${{ matrix.env }} init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=db_agnostic_performant_dbt/${{ matrix.env }}.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
          -backend-config="encrypt=true"
      - run: terraform -chdir=envs/${{ matrix.env }} plan -input=false -out=tfplan
      - name: apply (main only, gated by the environment's required reviewers)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform -chdir=envs/${{ matrix.env }} apply -input=false tfplan
